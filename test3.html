<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ディズニー施設マップ</title>

  <style>
    /* ===== 全体 ===== */
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Hiragino Sans', 'Meiryo', system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    #map {
      height: 100%;
      width: 100%;
      background: #eae6dd;
    }

    /* ===== 画面上に浮かぶUIの共通の見た目 ===== */
    .floating {
      position: absolute;
      z-index: 10;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: none;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18),
                  0 0 0 0.5px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease, background 0.2s ease;
    }
    .floating:active {
      transform: scale(0.94);
      background: rgba(245, 245, 245, 0.95);
    }

    /* ===== 戻るボタン（左上） ===== */
    #backBtn {
      top: calc(12px + var(--safe-top));
      left: 12px;
      width: 46px; height: 46px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #1a1a2e;
    }
    #backBtn svg { width: 22px; height: 22px; }

    /* ===== タイトルの帯（上部中央） ===== */
    #title-pill {
      top: calc(14px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 14px; font-weight: 700;
      color: #1a1a2e; letter-spacing: 0.02em;
      pointer-events: none;
      display: flex; align-items: center; gap: 7px;
    }
    #title-pill .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #e8491d;
    }

    /* ===== ズームボタン（右下） ===== */
    #zoom-ctrl {
      right: 14px;
      bottom: calc(24px + var(--safe-bottom));
      width: 46px; border-radius: 23px;
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .zoom-btn {
      width: 46px; height: 46px;
      border: none; background: transparent;
      font-size: 24px; font-weight: 300; color: #1a1a2e;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s ease;
    }
    .zoom-btn:active { background: rgba(0, 0, 0, 0.06); }
    .zoom-divider { height: 0.5px; background: rgba(0, 0, 0, 0.12); margin: 0 8px; }


    /* ======================================================= */
    /* ★ ポップアップ（マーカーをタップした時の表示）のデザイン   */
    /* ======================================================= */

    /* Googleの標準の白い吹き出しの「ガワ」を透明にして自分のデザインに差し替える */
    .gm-style .gm-style-iw-c {
      padding: 0 !important;             /* 中の余白をなくす */
      border-radius: 18px !important;    /* 角を丸く */
      box-shadow: 0 8px 28px rgba(0,0,0,0.22) !important;
      overflow: hidden;
    }
    /* 中身を包むGoogleの入れ物の余白も消す */
    .gm-style .gm-style-iw-d {
      padding: 0 !important;
      overflow: hidden !important;
    }
    /* 吹き出しの下の三角形の色（白のまま自然に見せる） */
    .gm-style .gm-style-iw-t::after {
      background: #ffffff !important;
    }
    /* 右上の×ボタンを少し内側に寄せて見やすくする */
    .gm-style .gm-style-iw-c button.gm-ui-hover-effect {
      top: 6px !important;
      right: 6px !important;
    }

    /* --- ここからが自分で作るカードの中身 --- */

    /* カード全体：絵文字（左）と情報（右）の横並び */
    .popup-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      min-width: 190px;
      max-width: 260px;
      background: #ffffff;
    }

    /* 左側の丸い絵文字アイコン */
    .popup-emoji {
      flex-shrink: 0;             /* 絵文字は縮まないようにする */
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 1.5px solid;        /* 色はJS側でカテゴリごとに指定 */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    /* 右側の文字情報のまとまり */
    .popup-body {
      min-width: 0;               /* 長い名前でもはみ出さないように */
    }

    /* カテゴリのラベル（「ポップコーン」など）。小さく色付きで */
    .popup-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 3px;
    }

    /* 施設の名前（主役なので大きめ・太め） */
    .popup-name {
      font-size: 16px;
      font-weight: 800;
      color: #1a1a2e;
      line-height: 1.3;
    }

    /* 補足説明（note がある時だけ出る） */
    .popup-note {
      margin-top: 6px;
      font-size: 12px;
      color: #667;
      line-height: 1.5;
      background: #f4f4f7;
      border-radius: 8px;
      padding: 5px 9px;
    }
  </style>
</head>

<body>

  <!-- ===== 戻るボタン（左上・円形） ===== -->
  <button id="backBtn" class="floating" onclick="location.href='hyousi.html'" aria-label="戻る">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </button>

  <!-- ===== タイトルの帯 ===== -->
  <div id="title-pill" class="floating">
    <span class="dot"></span>
    <span>ディズニーランド</span>
  </div>

  <!-- ===== 地図 ===== -->
  <div id="map"></div>

  <!-- ===== ズームボタン（右下） ===== -->
  <div id="zoom-ctrl" class="floating">
    <button class="zoom-btn" onclick="zoomIn()" aria-label="拡大">+</button>
    <div class="zoom-divider"></div>
    <button class="zoom-btn" onclick="zoomOut()" aria-label="縮小">−</button>
  </div>


  <!-- markers.js（データ）と script2.js（処理）を読み込む -->
  <script src="markers.js"></script>
  <script src="script2.js"></script>

  <script>
    let mapRef = null;

    function initMap() {

      // 1. くり抜く部分の点（[経度, 緯度]）
      const holeCoords = [
        [139.8780422, 35.6298653],
        [139.8774042, 35.6312691],
        [139.8770931, 35.6318761],
        [139.877118,  35.6341748],
        [139.8777946, 35.6355122],
        [139.8795214, 35.6361817],
        [139.8811688, 35.6357622],
        [139.88224,   35.6353588],
        [139.8828256, 35.6351491],
        [139.8838088, 35.6347547],
        [139.8859195, 35.6330194],
        [139.886249,  35.6320171],
        [139.8850008, 35.6312703],
        [139.884315,  35.6306529],
        [139.8834162, 35.6303557],
        [139.8826715, 35.6303006],
        [139.8806598, 35.6297032],
        [139.880534,  35.6293023],
        [139.8780422, 35.6298653]
      ];

      // 2. 上下左右の端を探す
      let west = 180, east = -180, south = 90, north = -90;
      let i = 0;
      while (i < holeCoords.length) {
        const lng = holeCoords[i][0];
        const lat = holeCoords[i][1];
        if (lng < west)  { west  = lng; }
        if (lng > east)  { east  = lng; }
        if (lat < south) { south = lat; }
        if (lat > north) { north = lat; }
        i = i + 1;
      }

      // 3. 地図の範囲の設定
      const center = { lat: 35.6326, lng: 139.8806 };
      const outerBounds = {
        north: 35.637544, south: 35.627657,
        east:  139.893391, west: 139.868139
      };
      const maskBounds = {
        north: outerBounds.north + 0.05,
        south: outerBounds.south - 0.05,
        east:  outerBounds.east  + 0.05,
        west:  outerBounds.west  - 0.05
      };

      // 4. 地図を作る
      const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 16.5,
        center: center,
        heading: 180,
        restriction: {
          latLngBounds: {
            north: 35.637544, south: 35.627657,
            east:  139.893391, west: 139.868139
          },
          strictBounds: false
        },
        maxZoom: 19,
        isFractionalZoomEnabled: true,
        clickableIcons: false,
        disableDefaultUI: true,
        styles: [
          { featureType: "poi",     stylers: [{ visibility: "off" }] },
          { featureType: "transit", stylers: [{ visibility: "off" }] },
          { featureType: "all", elementType: "labels.text", stylers: [{ visibility: "off" }] }
        ]
      });

      mapRef = map;
      initializeMarkers(map);

      // 5. パーク全体が画面に入るように合わせる
      const parkBounds = { north: north, south: south, east: east, west: west };
      function fitPark() {
        map.setOptions({ minZoom: null });
        map.fitBounds(parkBounds, 20);
        google.maps.event.addListenerOnce(map, "idle", function () {
          map.setOptions({ minZoom: map.getZoom() });
        });
      }
      fitPark();
      window.addEventListener("resize", fitPark);

      // 6. 中抜きマスク（パーク外を白く隠す）
      const maskGeoJson = {
        "type": "FeatureCollection",
        "features": [{
          "type": "Feature",
          "properties": {},
          "geometry": {
            "type": "Polygon",
            "coordinates": [
              [
                [maskBounds.west, maskBounds.north],
                [maskBounds.west, maskBounds.south],
                [maskBounds.east, maskBounds.south],
                [maskBounds.east, maskBounds.north],
                [maskBounds.west, maskBounds.north]
              ],
              holeCoords
            ]
          }
        }]
      };
      map.data.addGeoJson(maskGeoJson);
      map.data.setStyle({
        fillColor: "#FFFFFF",
        fillOpacity: 1.0,
        strokeColor: "#FFFFFF",
        strokeWeight: 0,
        clickable: false
      });
    }

    // ズームボタン（自作のプラス/マイナス）
    function zoomIn()  { if (mapRef) mapRef.setZoom(mapRef.getZoom() + 0.5); }
    function zoomOut() { if (mapRef) mapRef.setZoom(mapRef.getZoom() - 0.5); }
  </script>

  <!-- Google Maps本体（APIキーは伏せています） -->
  <script async src="himitu"></script>
</body>
</html>
